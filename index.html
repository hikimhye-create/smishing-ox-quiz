<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사기 문자 O/X 퀴즈</title>
<style>
:root{--ink:#1a1a1a;--bg:#fff;--teal:#99d9d9;--peach:#ffc9a0;--tip:#fff1c2;--orange:#f26b21;--rust:#b24300;--gray:#6a6a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:700;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;padding:16px;max-width:760px;width:100%;margin:0 auto}
.top{font-size:22px;color:var(--rust);margin:4px 0 10px}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}
.tg{text-align:center;font-size:clamp(22px,5vw,28px);color:var(--rust);margin-bottom:8px}
.q{background:var(--tip);border-radius:20px;padding:22px 18px;font-size:clamp(24px,5.4vw,34px);line-height:1.45;text-align:center;display:flex;align-items:center;justify-content:center;min-height:210px;white-space:pre-line}
.btns{display:flex;gap:14px;margin:16px 0}
.btns button{flex:1;min-height:130px;border:0;border-radius:24px;font:inherit;font-size:clamp(40px,10vw,60px);cursor:pointer;color:var(--ink)}
#bo{background:var(--teal)}#bx{background:var(--peach)}
.btns button:disabled{opacity:.35}
.res{display:none;border-radius:20px;padding:18px;font-size:clamp(24px,5.4vw,32px);line-height:1.5}
.res.ok{background:#d9f0d0}.res.no{background:#ffd9d0}
.res b{display:block;font-size:clamp(30px,7vw,42px);margin-bottom:6px}
.next{display:none;margin-top:14px;width:100%;min-height:84px;border:0;border-radius:20px;background:var(--ink);color:#fff;font:inherit;font-size:30px;cursor:pointer}
.home{text-align:center;padding-top:30px}
.home h1{font-size:clamp(36px,9vw,52px);line-height:1.3;margin:20px 0}
.home p{font-size:clamp(24px,5.5vw,30px);color:var(--gray);line-height:1.5}
.big{margin-top:24px;width:100%;min-height:96px;border:0;border-radius:24px;background:var(--orange);color:#fff;font:inherit;font-size:36px;cursor:pointer}
.score{font-size:clamp(60px,16vw,96px);color:var(--rust);margin:16px 0}
.list{text-align:left;margin-top:10px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #eee;font-size:clamp(20px,4.6vw,26px);line-height:1.4}
.tag{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tag.ok{background:#3a9d3a}.tag.no{background:#d9452b}
.tip{background:var(--tip);border-radius:16px;padding:14px;margin-top:18px;font-size:clamp(22px,5vw,28px);line-height:1.5}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[["요즘 수법 · 카드사 사칭", "\"[국제발신] 카드 개통 완료\n본인이 아니면 02-000-0000 문의\"\n번호가 적혀 있으니 바로 전화해서 확인한다", "X", "전화를 걸게 만든 뒤 \"본인 확인\"을 핑계로 금융정보를 묻는 수법이에요. 문자에 적힌 번호가 아니라 카드 뒷면이나 공식 앱의 번호로 확인해요."], ["요즘 수법 · 링크 없는 문자", "링크가 없어도 \"카카오톡으로 상담하세요\"\n\"전화 주세요\"라는 문자는 사기일 수 있다", "O", "링크를 안 눌러도 안심할 수 없어요. 카카오톡 상담이나 전화로 옮겨 가게 만든 뒤 수수료나 선입금을 요구하는 대출 사기가 늘었어요."], ["요즘 수법 · 가족 사칭", "\"엄마, 폰이 고장 나서 친구 폰이야\"\n전화해 보니 목소리가 아들 목소리와 똑같다\n그러니 믿고 돈을 보낸다", "X", "요즘은 목소리나 말투를 흉내 내는 수법도 있어서 \"똑같다\"만으로는 믿을 수 없어요. 평소 저장된 번호로 직접 전화하고, 가족만 아는 질문으로 확인해요."], ["요즘 수법 · 청첩장·부고", "아는 사람 이름이 적힌 모바일 청첩장 문자\n이름을 아니까 링크를 눌러 봐도 안전하다", "X", "결혼식이나 부고처럼 마음이 급해지는 소재를 쓰고, 이름까지 맞춰서 보내요. 링크를 누르기 전에 그 사람에게 직접 전화해서 확인해요."], ["요즘 수법 · 맞춤형 금융 사기", "은행 직원이라며 내 이름과 대출 한도를\n정확히 말한다\n정확히 아니까 진짜 은행이다", "X", "유출된 개인정보로 만든 \"맞춤형 사기\"예요. 이름·한도를 안다고 진짜가 아니에요. 대출을 먼저 갚으라거나 선입금하라는 말은 사기예요."], ["요즘 수법 · QR코드", "주차장이나 식당 QR코드 위에\n가짜 스티커가 덧붙여진 경우가 있다", "O", "진짜 QR 위에 가짜를 붙이는 수법이 있어요(큐싱). 찍은 뒤 앱 설치나 결제를 요구하면 멈추고, 의심되면 보호나라 카카오톡 채널의 큐싱 확인 서비스를 써요."], ["요즘 수법 · 원격제어 앱", "은행 직원이 알려 준 \"보안 점검 앱\"\n공식 앱스토어에서 받는 앱이니\n설치해도 된다", "X", "공식 앱스토어에 있는 앱도 원격제어 앱일 수 있어요. 어떤 기관도 전화나 문자로 앱 설치를 시키지 않아요. 설치하면 내 폰을 남이 조종해요."], ["미리 막는 방법", "내 이름으로 새 대출이나 계좌가 만들어지는 것을\n신청해서 미리 막아 둘 수 있다", "O", "금융회사 창구나 \"내계좌한눈에\"에서 금융거래 안심차단서비스를 신청하면, 새 대출과 비대면 계좌 개설 등을 막을 수 있어요."]];
var app=document.getElementById('app'),i=0,mine=[];
function home(){
 i=0;mine=[];
 app.innerHTML='<div class="home"><div class="top">수정노인복지관 · 1강</div><h1>사기 문자<br>O/X 퀴즈</h1><p>'+Q.length+'문제예요.<br>짝과 의논하고 답을 눌러요.</p><button class="big" id="go">시작하기</button></div>';
 document.getElementById('go').onclick=show;
}
function show(){
 app.innerHTML='<div class="top">문제 '+(i+1)+' / '+Q.length+'</div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="tg"></div><div class="q"></div><div class="btns"><button id="bo">O</button><button id="bx">X</button></div><div class="res" id="res"></div><button class="next" id="nx"></button>';
 app.querySelector('.tg').textContent=Q[i][0];app.querySelector('.q').textContent=Q[i][1];
 document.getElementById('bo').onclick=function(){ans('O')};
 document.getElementById('bx').onclick=function(){ans('X')};
}
function ans(a){
 mine[i]=a;
 var ok=a===Q[i][2],r=document.getElementById('res');
 document.getElementById('bo').disabled=document.getElementById('bx').disabled=true;
 r.className='res '+(ok?'ok':'no');r.style.display='block';
 r.innerHTML='<b>'+(ok?'맞아요!':'아니에요')+' 정답은 '+Q[i][2]+'</b><span></span>';
 r.querySelector('span').textContent=Q[i][3];
 var n=document.getElementById('nx');n.style.display='block';
 n.textContent=i<Q.length-1?'다음 문제':'결과 보기';
 n.onclick=function(){i++;i<Q.length?show():end()};
 r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function end(){
 var s=0,h='';
 for(var k=0;k<Q.length;k++){var ok=mine[k]===Q[k][2];if(ok)s++;
  h+='<div class="row"><span class="tag '+(ok?'ok':'no')+'">'+(ok?'O':'X')+'</span><span>'+(k+1)+'번 정답 '+Q[k][2]+'</span></div>';}
 app.innerHTML='<div class="home"><div class="top">결과</div><div class="score">'+s+' / '+Q.length+'</div><p>'+(s>=7?'아주 잘하셨어요!':s>=5?'잘하셨어요!':'괜찮아요. 한 번 더 해 봐요.')+'</p><div class="list">'+h+'</div><div class="tip">오늘의 한마디<br>누르지 않는다, 끊는다, 확인한다.</div><button class="big" id="re">다시 풀기</button></div>';
 document.getElementById('re').onclick=home;
}
home();
</script>
</body>
</html>
